<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{.Repo.Name}}</title>
<style>
body{font-family:system-ui,sans-serif;max-width:60rem;margin:2rem auto;padding:0 1rem;color:#222}
table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:.35rem .6rem;border-bottom:1px solid #ddd}
nav a{margin-right:1rem}
</style></head>
<body>
<h1>{{.Repo.Name}}</h1>
<nav><a href="{{.Repo.Slug}}.repo">{{.Repo.Slug}}.repo</a><a href="feed.xml">feed.xml</a></nav>
<table>
<thead><tr><th>Package</th><th>Version</th><th>Release</th><th>Arch</th><th>Size</th><th>Added</th><th>File</th></tr></thead>
<tbody>
{{range .Packages}}<tr><td>{{.Name}}</td><td>{{.Version}}</td><td>{{.Release}}</td><td>{{.Arch}}</td><td>{{size .Size}}</td><td>{{.AddedAt.Format "2006-01-02"}}</td><td><a href="{{.Filename}}">{{.Filename}}</a></td></tr>
{{else}}<tr><td colspan="7">No packages yet.</td></tr>{{end}}
</tbody></table>
</body></html>
