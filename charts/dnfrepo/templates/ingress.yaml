{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "dnfrepo.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}
                port: { number: {{ .Values.service.port }} }
    {{- if and .Values.registry.enabled .Values.registry.host (ne .Values.registry.host .Values.ingress.host) }}
    - host: {{ .Values.registry.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}
                port: { number: {{ .Values.service.port }} }
    {{- end }}
  {{- if .Values.ingress.tlsSecret }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
        {{- if and .Values.registry.enabled .Values.registry.host (ne .Values.registry.host .Values.ingress.host) }}
        - {{ .Values.registry.host }}
        {{- end }}
      secretName: {{ .Values.ingress.tlsSecret }}
  {{- end }}
{{- end }}
